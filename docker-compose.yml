services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg_local_password
      POSTGRES_DB: tcg_tracker
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8081:3000"
    environment:
      DATABASE_URL: postgres://tcg:tcg_local_password@db:5432/tcg_tracker
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data: